
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scopesim-cli"
version = "0.1.0"
description = "A command-line interface for ScopeSim"

authors = [
    { name = "Alessio Popovik" },
]

dependencies = [
    "scopesim",
    "scopesim_templates",
    "questionary",
]

[project.scripts]
scopesim-cli = "scopesim_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scopesim_cli"]
